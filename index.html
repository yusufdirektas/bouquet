<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Virtual Bouquet</title>
    <meta name="description" content="A 3D digital bouquet and a personal message — flowers that never wilt. Create your own and share it with someone you love." />

    <!-- Icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#c04f7d" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#26141c" media="(prefers-color-scheme: dark)" />

    <!-- Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="A Virtual Bouquet" />
    <meta property="og:title" content="A Virtual Bouquet" />
    <meta property="og:description" content="A 3D digital bouquet and a personal message — flowers that never wilt." />
    <meta property="og:image" content="https://hediyeniz.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://hediyeniz.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="A Virtual Bouquet" />
    <meta name="twitter:description" content="A 3D digital bouquet and a personal message — flowers that never wilt." />
    <meta name="twitter:image" content="https://hediyeniz.app/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css">
    <script>
      (function () {
        try {
          var t = localStorage.getItem('vb-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <button class="tool-button" id="customize-button" type="button" aria-label="Customize gift">
      <span aria-hidden="true">✎</span>
    </button>
    <button class="tool-button theme-toggle" id="theme-toggle" type="button" aria-label="Switch theme">
      <span class="theme-icon" id="theme-icon">☾</span>
    </button>

    <div class="customize-panel" id="customize-panel" aria-hidden="true">
      <div class="customize-sheet" role="dialog" aria-modal="true" aria-label="Customize your gift">
        <div class="customize-head">
          <h2>Customize your gift</h2>
          <button class="customize-close" id="customize-close" type="button" aria-label="Close">✕</button>
        </div>

        <div class="field">
          <span class="field-label">Photo</span>
          <label class="photo-upload" for="customize-photo">
            <img id="customize-preview" alt="Selected photo preview" />
            <span class="photo-upload-hint">Click to choose a photo</span>
            <input type="file" id="customize-photo" accept="image/*" />
          </label>
        </div>

        <label class="field" for="customize-title">
          <span class="field-label">Title</span>
          <input type="text" id="customize-title" maxlength="80" placeholder="Happy Birthday," />
        </label>

        <label class="field" for="customize-body">
          <span class="field-label">Message</span>
          <textarea id="customize-body" rows="5" maxlength="800" placeholder="Write your message here..."></textarea>
        </label>

        <label class="field" for="customize-signature">
          <span class="field-label">Signature</span>
          <input type="text" id="customize-signature" maxlength="60" placeholder="- With love" />
        </label>

        <div class="customize-actions">
          <button class="ghost-button" id="customize-reset" type="button">Reset</button>
          <button class="primary-button" id="customize-save" type="button">Preview</button>
        </div>

        <button class="primary-button share-button" id="customize-share" type="button">Create shareable link</button>

        <div class="share-result" id="share-result" hidden>
          <p class="share-hint">Send this link — it opens your personalized gift.</p>
          <div class="share-row">
            <input type="text" id="share-link" readonly aria-label="Shareable link" />
            <button class="ghost-button" id="share-copy" type="button">Copy</button>
          </div>
        </div>
      </div>
    </div>
    <div class="intro-overlay" id="intro-overlay">
      <div class="intro-content">
        <div class="envelope-stage" id="envelope-stage">
          <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Open the envelope">
            <span class="envelope-body"></span>
            <span class="envelope-flap"></span>
            <span class="envelope-letter"></span>
            <span class="photo-card" id="photo-card" role="button" tabindex="0" aria-label="Enlarge the photo">
              <img src="/picture.jpg" alt="A cherished memory" />
            </span>
          </div>
        </div>
        <p class="intro-text" id="intro-text">A gift has arrived for you. Please click the envelope.</p>
        <p class="memory-caption" id="memory-caption">A MEMORY FROM YEARS AGO</p>
        <button class="reveal-button" id="reveal-button" type="button">Click to see your gift</button>
      </div>
    </div>

    <div id="gift-app">
      <div class="card-container" id="card-container">
        <div class="glass-card">
          <h1 id="gift-title">Loading...</h1>
          <p id="gift-body">Fetching the message.</p>
          <div class="signature" id="gift-signature"></div>
          <button class="flower-only-button" id="flower-only-button" type="button">Click to see the flowers</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
